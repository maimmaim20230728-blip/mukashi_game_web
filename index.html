<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf3e0">
<meta name="description" content="桃太郎、赤ずきん、浦島太郎。おなじみの昔話が、あなたの選択で別の結末へ。原典に伝わる幻の結末も収録した、読む昔話アドベンチャー。">
<title>名作の主人公になろう！</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="名作の主人公になろう！">
<meta property="og:description" content="桃太郎、赤ずきん、浦島太郎。おなじみの昔話が、あなたの選択で別の結末へ。原典に伝わる幻の結末も収録した、読む昔話アドベンチャー。">
<meta property="og:image" content="https://maimmaim20230728-blip.github.io/mukashi_game_web/ogp.png">
<meta property="og:url" content="https://maimmaim20230728-blip.github.io/mukashi_game_web/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#faf3e0; --panel:#fffdf5; --ink:#4a3728;
  --accent:#e8804f; --accent-dark:#c9642f; --green:#5aa66b;
  --frame:#c9a86b; --dim:#b8a88e;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:'Hiragino Maru Gothic ProN','BIZ UDGothic','Yu Gothic UI','Meiryo',sans-serif;
  min-height:100vh;display:flex;justify-content:center;
  /* エッジtoエッジ(AAB)の きりかけを よける。Webでは 0 なので みためは かわらない */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
#app{width:100%;max-width:560px;padding:14px 12px 28px}
.screen{display:none}
.screen.on{display:block}

/* ---- タイトル ---- */
.titlebox{text-align:center;padding:26px 10px 10px}
/* タイトルの絵(v1.7.0〜・世界の物語の とびら)。はばは titlebox いっぱい(最大380px)・たかさは 絵の比率のまま */
.titlebox .titleArt{max-width:380px;margin:0 auto}
.titlebox .titleArt svg{width:100%;height:auto;display:block}
/* art.js に まだ 絵が ない ときの ひかえ(これまでの 🍑) */
.titlebox .momo{font-size:60px;line-height:1}
h1{font-size:32px;letter-spacing:.04em;margin:18px 0 6px;line-height:1.5}
h1 rt{font-size:11px;letter-spacing:.2em;color:#8a7a62}
.subtitle{font-size:13px;color:#8a7a62;margin-bottom:26px}
.menu{display:flex;flex-direction:column;gap:12px;max-width:320px;margin:0 auto}
.menu button{
  font-size:19px;padding:15px 10px;border-radius:14px;border:3px solid var(--accent-dark);
  background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;
}
.menu button.sub{background:var(--panel);color:var(--ink);border-color:var(--frame)}
.foot{margin-top:34px;font-size:11px;color:#a08f76;text-align:center;line-height:1.9}
.foot a{color:#8a7a62}
.foot button{font-size:11px;padding:5px 12px;border-radius:8px;border:1px solid var(--dim);background:none;color:#a08f76;cursor:pointer;font-family:inherit}

/* ---- おはなしえらび ---- */
h2{font-size:20px;margin:8px 0 14px;text-align:center;letter-spacing:.1em}
.cards{display:flex;flex-direction:column;gap:10px}
.card{
  background:var(--panel);border:3px solid var(--frame);border-radius:14px;
  padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:14px;
}
.card .ico{font-size:34px;width:44px;text-align:center;flex:none}
.card .nm{font-size:18px;font-weight:700}
.card .tg{font-size:12px;color:#8a7a62;margin-top:3px}
.card.locked{cursor:default;background:#f1e9d8;color:#9c8d76}
.card.locked .nm{color:#9c8d76}
.card.dim{opacity:.55;cursor:default}
.backrow{margin-top:18px;text-align:center}
.backrow button,.gamefoot button{
  font-size:14px;padding:12px 20px;border-radius:10px;border:2px solid var(--frame);
  background:var(--panel);color:var(--ink);cursor:pointer;font-family:inherit;
  min-height:44px;                    /* 実機で 押しやすい 44px を たしかに 確保する */
}
.gamefoot{margin-top:14px;text-align:center;display:flex;gap:10px;justify-content:center;align-items:center}
/* 設定歯車: 文字サイズ設定に連動させず固定サイズ(実機で押しやすい44px以上) */
.gearbtn{width:48px;height:44px;font-size:20px !important;padding:0 !important;flex:none}

/* ---- ゲーム画面 ---- */
.stage{background:#fff;border:4px solid var(--frame);border-radius:16px;overflow:hidden;position:relative}
.stage svg{width:100%;height:auto;display:block}
.textbox{
  background:var(--panel);border:3px solid var(--frame);border-radius:14px;
  padding:14px 16px;margin-top:10px;font-size:17px;line-height:1.95;min-height:104px;
  white-space:pre-line;
}
.choices{margin-top:10px;display:flex;flex-direction:column;gap:9px}
.choices button{
  font-size:17px;padding:13px 14px;border-radius:12px;cursor:pointer;font-family:inherit;
  border:3px solid var(--accent-dark);background:var(--accent);color:#fff;font-weight:700;
  text-align:left;
}
.choices button.next{
  background:var(--panel);color:var(--ink);border-color:var(--frame);text-align:center;
}
.choices button.zk{background:var(--green);border-color:#3f7e50;text-align:center}
.choices button:disabled{opacity:.4;cursor:default}
.choices button.next.ready{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

/* もじの おおきさ */
body[data-fs="s"] .textbox{font-size:15px;line-height:1.85}
body[data-fs="s"] .choices button{font-size:15px}
body[data-fs="l"] .textbox{font-size:20px;line-height:2.05}
body[data-fs="l"] .choices button{font-size:19px}
/* 「おおきい」は 本文だけでなく ずかん・カードのタグ・注記も おおきくする */
body[data-fs="l"] .zcell .zn{font-size:17px}
body[data-fs="l"] .zcell .zh{font-size:14px}
body[data-fs="l"] .zsecnote{font-size:14px}
body[data-fs="l"] .card .tg{font-size:14px}
body[data-fs="l"] .znote{font-size:13px}

/* ---- せってい ---- */
.setrow{background:var(--panel);border:3px solid var(--frame);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.setrow .sl{font-size:15px;font-weight:700;margin-bottom:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:64px;min-height:44px;font-size:14px;padding:12px 6px;border-radius:10px;cursor:pointer;font-family:inherit;
  border:2px solid var(--frame);background:#f1e9d8;color:#8a7a62;
}
.seg button.on{background:var(--accent);border-color:var(--accent-dark);color:#fff;font-weight:700}

/* ---- ずかん ---- */
.zgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zcell{background:var(--panel);border:3px solid var(--frame);border-radius:12px;padding:12px}
.zcell .zn{font-size:15px;font-weight:700}
.zcell .zh{font-size:12px;color:#8a7a62;margin-top:5px;line-height:1.6}
.zcell.lock{background:#f1e9d8}
.zcell.lock .zn{color:#b0a189}
.zcount{text-align:center;font-size:14px;margin:2px 0 8px;color:#8a7a62}
.znote{text-align:center;font-size:11px;margin:0 6px 12px;color:#a08f76;line-height:1.7}
/* おはなしごとの みだし行(ZKの {section:'…'} 要素) */
.zsec{
  grid-column:1 / -1;font-size:15px;font-weight:700;color:#8a7a62;letter-spacing:.08em;
  border-bottom:2px solid var(--frame);padding:8px 3px 6px;margin-top:8px;
}
.zsec:first-child{margin-top:0}
/* みだしに つく 注記(ZKの {section:'…', note:'…'}) */
.zsecnote{
  grid-column:1 / -1;font-size:12px;color:#a08f76;line-height:1.9;
  text-align:left;margin:0 3px;
}

/* ---- カットイン ---- */
#cutin{position:fixed;inset:0;display:none;z-index:50;cursor:pointer;overflow:hidden}
#cutin.on{display:block}
.ci-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}

#cutin.waza .ci-inner{animation:shake .35s;overflow:hidden}
.stripe-bg{position:absolute;inset:-140px;z-index:0;animation:stripeFlow 1s linear infinite}
@keyframes stripeFlow{to{transform:translate(-56px,-56px)}}
#cutin.waza .ci-text{
  position:relative;z-index:2;
  font-size:46px;font-weight:900;color:#fff;letter-spacing:.06em;text-align:center;line-height:1.4;
  text-shadow:3px 3px 0 #c9642f,-2px -2px 0 #c9642f,2px -2px 0 #c9642f,-2px 2px 0 #c9642f,0 6px 14px rgba(0,0,0,.25);
  animation:pop .45s cubic-bezier(.2,1.6,.4,1);
}
.ci-icon{position:relative;z-index:2;animation:pop .4s cubic-bezier(.2,1.6,.4,1), iconBounce .8s .4s ease-in-out infinite}
@keyframes iconBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

#cutin.kao .ci-inner{overflow:hidden}
#cutin .flines{position:absolute;left:-25%;top:-25%;width:150%;height:150%;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#cutin.kao .ci-face{
  width:min(46vh,300px,80vw);height:min(46vh,300px,80vw);border-radius:50%;
  background:#fffdf5;border:6px solid #4a3a2c;overflow:hidden;position:relative;z-index:2;
  animation:pop .4s cubic-bezier(.2,1.6,.4,1), kaoPunch .5s .42s;
}
@keyframes kaoPunch{0%,100%{transform:none}25%{transform:translate(-6px,4px) rotate(-2deg)}55%{transform:translate(5px,-4px) rotate(1.5deg)}80%{transform:translate(-3px,2px)}}
#cutin.kao .ci-face svg{width:100%;height:100%;display:block}
#cutin.kao .ci-text{
  position:relative;z-index:2;
  font-size:34px;font-weight:900;color:#4a3a2c;background:#fffdf5;
  padding:10px 30px;border-radius:16px;border:4px solid #4a3a2c;text-align:center;line-height:1.4;
  animation:slideup .35s ease-out;
}

#cutin.vs .ci-inner{flex-direction:row;gap:0;animation:vsClash .35s .45s}
@keyframes vsClash{0%,100%{transform:none}30%{transform:translate(-7px,5px)}60%{transform:translate(6px,-4px)}}
#cutin.vs .vs-half{position:absolute;top:-10%;bottom:-10%;width:80%}
#cutin.vs .vs-left{left:-22%;background:#4a8fd4;transform:skewX(-12deg);border-right:8px solid #fffdf5}
#cutin.vs .vs-right{right:-22%;background:#c94a4a;transform:skewX(-12deg);border-left:8px solid #fffdf5}
#cutin.vs .ci-face{
  width:min(38vh,240px,30vw);height:min(38vh,240px,30vw);border-radius:50%;
  background:#fffdf5;border:6px solid #4a3a2c;overflow:hidden;position:relative;z-index:2;margin:0 3vw;
}
#cutin.vs .ci-face svg{width:100%;height:100%;display:block}
#cutin.vs .f1{animation:fromleft .4s ease-out}
#cutin.vs .f2{animation:fromright .4s ease-out}
#cutin.vs .ci-text{
  position:relative;z-index:3;font-size:56px;font-weight:900;color:#fff;
  text-shadow:3px 3px 0 #4a3a2c,-2px -2px 0 #4a3a2c,2px -2px 0 #4a3a2c,-2px 2px 0 #4a3a2c;
  animation:pop .5s cubic-bezier(.2,1.6,.4,1), vsPulse 1s .6s ease-in-out infinite;
}
@keyframes vsPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

#cutin.dark .ci-inner{background:#15120e}
#cutin.dark .ci-text{
  font-size:26px;font-weight:700;color:#f5efe2;letter-spacing:.1em;line-height:2.2;text-align:center;
  animation:darkIn 1.4s ease-out;white-space:pre-line;
}
@keyframes darkIn{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}

/* なかま加入スタンプ型 */
#cutin.join .ci-inner{background:#ffd76e}
#cutin.join .ci-face{
  width:min(44vh,280px,76vw);height:min(44vh,280px,76vw);border-radius:50%;
  background:#fffdf5;border:6px solid #4a3a2c;overflow:hidden;position:relative;z-index:2;
  animation:pop .45s cubic-bezier(.2,1.7,.4,1), joinHop .7s .5s ease-in-out infinite;
}
@keyframes joinHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.join-ring{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;
  width:min(44vh,280px,76vw);height:min(44vh,280px,76vw);border-radius:50%;
  border:6px solid rgba(255,255,255,.9);animation:ringPulse 1.1s .35s ease-out infinite;
}
@keyframes ringPulse{0%{opacity:.9;scale:1}100%{opacity:0;scale:1.55}}
#cutin.join .ci-face svg{width:100%;height:100%;display:block}
#cutin.join .ci-text{
  position:relative;z-index:2;
  font-size:30px;font-weight:900;color:#4a3a2c;background:#fffdf5;
  padding:10px 26px;border-radius:16px;border:4px solid #4a3a2c;text-align:center;line-height:1.4;
  animation:slideup .35s ease-out;
}
.ci-star{position:absolute;font-size:34px;color:#fff;z-index:1;animation:twinkle 1s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.2);opacity:1}}

/* もも割れ専用型 */
#cutin.paka .ci-inner{background:repeating-linear-gradient(45deg,#ffdce6 0 30px,#ffd0de 30px 60px)}
.paka-svg{width:min(52vh,330px,84vw);height:auto;display:block;position:relative;z-index:2}
.paka-svg .phL{transform-origin:130px 110px;animation:pakaL .55s .1s ease-out forwards}
.paka-svg .phR{transform-origin:130px 110px;animation:pakaR .55s .1s ease-out forwards}
.paka-svg .pburst{transform-origin:130px 110px;transform:scale(0);animation:burst .45s .3s ease-out forwards}
.paka-svg .pbaby{transform-origin:130px 110px;transform:scale(0);animation:burst .4s .45s cubic-bezier(.2,1.7,.4,1) forwards, babyWobble 1s 1s ease-in-out infinite}
@keyframes babyWobble{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1) rotate(-5deg)}75%{transform:scale(1) rotate(5deg)}}
@keyframes pakaL{100%{transform:translate(-52px,8px) rotate(-16deg)}}
@keyframes pakaR{100%{transform:translate(52px,8px) rotate(16deg)}}
@keyframes burst{100%{transform:scale(1)}}
#cutin.paka .ci-text{
  font-size:44px;font-weight:900;color:#fff;letter-spacing:.06em;position:relative;z-index:2;
  text-shadow:3px 3px 0 #e87f96,-2px -2px 0 #e87f96,2px -2px 0 #e87f96,-2px 2px 0 #e87f96;
  animation:pop .45s .25s cubic-bezier(.2,1.6,.4,1) backwards;
}

/* 刀閃フラッシュ型 */
#cutin.flash .ci-inner{background:#fdfcf8;animation:flashBlink .5s}
@keyframes flashBlink{0%{background:#fdfcf8}15%{background:#fff}30%{background:#e9f2ff}45%{background:#fdfcf8}}
.fl-slash{position:absolute;left:-20%;right:-20%;height:14px;z-index:1;
  background:linear-gradient(90deg,transparent,#41526b 25%,#41526b 75%,transparent);
  transform:rotate(-16deg) scaleX(0);animation:slash .2s ease-out forwards}
.fl-slash.fl2{height:9px;transform:rotate(11deg) scaleX(0);animation-delay:.1s}
@keyframes slash{100%{transform:rotate(var(--rot,-16deg)) scaleX(1)}}
#cutin.flash .ci-text{
  position:relative;z-index:2;font-size:44px;font-weight:900;color:#b03a3a;letter-spacing:.06em;text-align:center;
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,4px 6px 10px rgba(0,0,0,.18);
  animation:pop .4s .18s cubic-bezier(.2,1.6,.4,1) backwards;
}

/* ぱくり専用型(オオカミの あぎとが 上下から とじる) */
#cutin.pakuri .ci-inner{background:#c96a52;overflow:hidden;animation:shake .4s .34s}
.pk-jaw{position:absolute;left:-1%;width:102%;height:54%;z-index:1}
.pk-jaw svg{width:100%;height:100%;display:block}
.pk-top{top:0;animation:pkTop .35s ease-in backwards}
.pk-bot{bottom:0;animation:pkBot .35s ease-in backwards}
@keyframes pkTop{0%{transform:translateY(-102%)}100%{transform:none}}
@keyframes pkBot{0%{transform:translateY(102%)}100%{transform:none}}
.pk-dark{position:absolute;inset:0;background:#15120e;opacity:0;z-index:2;animation:pkDark .4s .34s ease-out forwards}
@keyframes pkDark{100%{opacity:1}}
#cutin.pakuri .ci-text{
  position:relative;z-index:3;
  font-size:40px;font-weight:900;color:#fff;letter-spacing:.08em;text-align:center;line-height:1.5;
  white-space:pre-line;text-shadow:0 5px 16px rgba(0,0,0,.7);
  animation:pkText .5s .42s ease-out backwards;
}
@keyframes pkText{0%{opacity:0;transform:scale(1.35)}100%{opacity:1;transform:none}}

/* ちょっきん専用型(ハサミの 2まいの はが Xに とじる) */
#cutin.chokkin .ci-inner{background:#fdfcf8;overflow:hidden;animation:shake .3s .4s}
.ck-blade{
  position:absolute;left:50%;top:50%;width:min(88vw,470px);aspect-ratio:440/96;
  transform-origin:50% 50%;translate:-50% -50%;z-index:1;
}
.ck-blade svg{width:100%;height:100%;display:block}
.ck-b1{animation:ckClose1 .4s cubic-bezier(.4,0,.15,1) forwards}
.ck-b2{animation:ckClose2 .4s cubic-bezier(.4,0,.15,1) forwards}
@keyframes ckClose1{0%{rotate:-62deg;opacity:0}25%{opacity:1}100%{rotate:-21deg;opacity:1}}
@keyframes ckClose2{0%{rotate:62deg;opacity:0}25%{opacity:1}100%{rotate:21deg;opacity:1}}
.ck-flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:2;animation:ckFlash .5s .38s ease-out forwards}
@keyframes ckFlash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
#cutin.chokkin .ci-text{
  position:relative;z-index:3;
  font-size:44px;font-weight:900;color:#41526b;letter-spacing:.06em;text-align:center;line-height:1.4;
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,4px 6px 12px rgba(65,82,107,.25);
  animation:pop .42s .4s cubic-bezier(.2,1.6,.4,1) backwards;
}

/* すっぽーん専用型(かぶが 画面したから とびあがり、つちの つぶが ちる) */
#cutin.suppon .ci-inner{background:#aee3f5;overflow:hidden;justify-content:flex-start;padding-top:11%}
.sp-kabu{
  position:absolute;left:50%;top:55%;width:min(38vh,240px,58vw);z-index:2;
  animation:spFly .5s cubic-bezier(.15,.85,.35,1) forwards;
}
.sp-kabu svg{width:100%;height:auto;display:block}
@keyframes spFly{
  0%{transform:translate(-50%,58vh) rotate(-15deg)}
  100%{transform:translate(-50%,-50%) rotate(9deg)}
}
.sp-dirt{
  position:absolute;left:50%;top:62%;border-radius:50%;background:#7a5a34;z-index:1;
  opacity:0;transform:translate(-50%,-50%);animation:spDirt .85s ease-out forwards;
}
@keyframes spDirt{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}
  62%{opacity:.95}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1)}
}
#cutin.suppon .ci-text{
  position:relative;z-index:3;
  font-size:46px;font-weight:900;color:#fff;letter-spacing:.06em;text-align:center;line-height:1.4;
  text-shadow:3px 3px 0 #4d8ba3,-2px -2px 0 #4d8ba3,2px -2px 0 #4d8ba3,-2px 2px 0 #4d8ba3,0 6px 14px rgba(0,0,0,.2);
  animation:pop .45s .4s cubic-bezier(.2,1.6,.4,1) backwards;
}

/* しろい けむり専用型(たまてばこから けむりが ゆっくり たちのぼる・しずかな場面なので ゆれは 入れない) */
#cutin.kemuri .ci-inner{background:#3a3f4a;overflow:hidden}
.km-box{
  position:absolute;left:50%;bottom:8%;width:min(20vh,130px,30vw);z-index:1;
  transform:translateX(-50%);
}
.km-box svg{width:100%;height:auto;display:block}
.km-smoke{
  position:absolute;left:50%;bottom:12%;width:min(120vh,900px,165vw);z-index:2;
  transform:translate(-50%,0) scale(.12);transform-origin:50% 100%;opacity:0;
  animation:kmRise 1.6s ease-out forwards;
}
.km-smoke svg{width:100%;height:auto;display:block}
@keyframes kmRise{
  0%{opacity:0;transform:translate(-50%,0) scale(.12)}
  35%{opacity:.5}
  100%{opacity:.92;transform:translate(-50%,-5%) scale(1)}
}
#cutin.kemuri .ci-text{
  position:relative;z-index:3;
  font-size:34px;font-weight:700;color:#4a3a2c;letter-spacing:.1em;text-align:center;line-height:1.6;
  white-space:pre-line;animation:kmText 1s 1.2s ease-out backwards;
}
@keyframes kmText{0%{opacity:0}100%{opacity:1}}

/* ふうふう専用型(よこに ながれる 大風。still=ゆれも かけらも 出さず かぜだけが とおりすぎる) */
/* そらの いろは ゆれない #cutin がわに 敷く(ゆれた ときに ふちが すけない ように) */
#cutin.fuu{background:#bfe0f0}
#cutin.fuu .ci-inner{overflow:hidden;animation:shake .5s 2}
#cutin.fuu .ci-inner.still{animation:none}
.fu-line{position:absolute;left:0;z-index:1;animation:fuFlow 1.15s linear infinite}
.fu-line svg{width:100%;height:auto;display:block}
@keyframes fuFlow{
  0%{transform:translateX(-50vw);opacity:0}
  14%{opacity:.95}
  82%{opacity:.95}
  100%{transform:translateX(115vw);opacity:0}
}
.fu-bit{position:absolute;left:0;z-index:2;border-radius:3px;animation:fuBit 1.1s linear infinite}
@keyframes fuBit{
  0%{transform:translate(-25vw,0) rotate(0);opacity:0}
  12%{opacity:1}
  84%{opacity:1}
  100%{transform:translate(112vw,var(--dy)) rotate(var(--rot));opacity:0}
}
#cutin.fuu .ci-text{
  position:relative;z-index:3;max-width:92%;
  /* ふうふうの せりふは ながい(「……びくとも しない！！」等)。はばに あわせて 字を ちぢめる */
  font-size:min(46px,7.5vw);font-weight:900;color:#fff;letter-spacing:.06em;text-align:center;line-height:1.4;
  white-space:pre-line;
  text-shadow:3px 3px 0 #4d8ba3,-2px -2px 0 #4d8ba3,2px -2px 0 #4d8ba3,-2px 2px 0 #4d8ba3,0 6px 14px rgba(0,0,0,.2);
  animation:pop .45s cubic-bezier(.2,1.6,.4,1);
}

/* おかし専用型(おかしの いえが あらわれる しゅんかん)
   あまい 場面なので ゆれは 入れず、ほうしゃの グラデの 上に おかしが ふわふわ ふってくるだけに する */
#cutin.okashi .ci-inner{
  background:radial-gradient(circle at 50% 44%, #fff4dc 0%, #ffe2ee 46%, #cfe9f7 100%);
  overflow:hidden;
}
.ok-sweet{position:absolute;top:0;z-index:1;animation:okFall linear infinite}
.ok-sweet svg{width:100%;height:auto;display:block}
/* --sx=よこゆれ(vw) / --rot=まわる かくど。おくらせを マイナスに して はじめから ふらせる */
@keyframes okFall{
  0%{transform:translate(0,-22vh) rotate(0);opacity:0}
  10%{opacity:1}
  50%{transform:translate(var(--sx),44vh) rotate(calc(var(--rot) / 2))}
  88%{opacity:1}
  100%{transform:translate(0,112vh) rotate(var(--rot));opacity:0}
}
#cutin.okashi .ci-text{
  position:relative;z-index:3;max-width:92%;
  /* 「おかしの いえ！！」など。はばに あわせて 字を ちぢめる(ふうふう型と おなじ)。
     したじが うすい いろ なので、字は こい ローズ + しろい ふちで よめる ように する */
  font-size:min(46px,7.5vw);font-weight:900;color:#d1567f;letter-spacing:.06em;text-align:center;line-height:1.4;
  white-space:pre-line;
  text-shadow:3px 3px 0 #fffdf8,-2px -2px 0 #fffdf8,2px -2px 0 #fffdf8,-2px 2px 0 #fffdf8,0 6px 14px rgba(160,90,120,.28);
  animation:pop .45s cubic-bezier(.2,1.6,.4,1);
}

/* ひかりの はしら専用型(たけが ひかる / 十五夜の むかえ / しょうてん)
   しずかで おごそかな 場面なので、ゆれも ほうしゃせんも 入れない。
   こんの そらに ひかりの おびが 上から おりてきて、ちいさな つぶが しずかに 上下に 舞うだけ */
#cutin.hikari .ci-inner{background:#1a1f3a;overflow:hidden}
.hk-beam{
  position:absolute;left:50%;top:0;bottom:0;width:34%;max-width:400px;z-index:1;
  transform:translateX(-50%);transform-origin:50% 0;
  background:linear-gradient(to bottom,
    rgba(255,253,246,.95) 0%, rgba(240,235,255,.72) 34%,
    rgba(206,196,240,.4) 68%, rgba(160,150,210,0) 100%);
  filter:blur(2px);
  animation:hkBeam 1.5s ease-out backwards;
}
/* そとがわに もう1まい、ぼかした うすい おびを かさねて ふちを やわらかく する */
.hk-beam.hk-halo{width:46%;max-width:540px;filter:blur(14px);opacity:.35;animation-duration:1.9s}
@keyframes hkBeam{
  0%{transform:translateX(-50%) scaleY(0);opacity:0}
  35%{opacity:1}
  100%{transform:translateX(-50%) scaleY(1);opacity:1}
}
/* --dy=たてに うごく はば(vh)。ゆっくり 上下に 舞わせる(よこには うごかさない) */
.hk-grain{
  position:absolute;border-radius:50%;z-index:2;
  background:radial-gradient(circle,#fffdf5 0%,rgba(226,216,255,.85) 45%,rgba(200,190,240,0) 100%);
  animation:hkFloat ease-in-out infinite alternate;
}
@keyframes hkFloat{
  0%{transform:translateY(0);opacity:.25}
  50%{opacity:.95}
  100%{transform:translateY(var(--dy));opacity:.4}
}
#cutin.hikari .ci-text{
  position:relative;z-index:3;max-width:92%;
  /* こんの したじに 映える しろ + うすむらさきの ふち。
     はばに あわせて 字を ちぢめる(ふうふう型・おかし型と おなじ) */
  font-size:min(46px,7.5vw);font-weight:900;color:#fffdf8;letter-spacing:.08em;text-align:center;line-height:1.5;
  white-space:pre-line;
  text-shadow:3px 3px 0 #5a4f8a,-2px -2px 0 #5a4f8a,2px -2px 0 #5a4f8a,-2px 2px 0 #5a4f8a,0 6px 18px rgba(120,110,190,.55);
  /* しずかな 場面なので はねる pop では なく、そっと うかびあがらせる */
  animation:hkText 1.1s .5s ease-out backwards;
}
@keyframes hkText{0%{opacity:0}100%{opacity:1}}

/* かさね専用型(まどべの つみかさなり)
   よるの こんの そらに、まどの あかりだけが うかぶ。その まえに ロバ→イヌ→ネコ→オンドリの
   シルエットが したから じゅんばんに つみあがり、そのたびに なきごえが とびだす。
   さいごに 4ひきが そろって ちいさく ゆれて、メインの もじが 出る。
   🔴ブレーメン市の どうぞうの 造形は うつさない(単色の かげえ + へいめんな まど だけ) */
#cutin.kasane .ci-inner{background:#141a2e;overflow:hidden}
/* まどと つみかさなりを 1つの はこに いれて、もじと いっしょに たてに まんなかへ そろえる。
   はこの たては はばの 1.25ばい。つみかさなりの あしもとが はこの そこに くる */
.ks-scene{position:relative;z-index:1;width:min(84vw,52vh,440px);aspect-ratio:1 / 1.25}
/* まどの あかり。よこ さん・たて さんは 背景がぞうで かさねる(DOMを ふやさない)。
   したの ふちが ちょうど ロバの せなかの たかさに くる ように 68% に する */
.ks-mado{
  position:absolute;left:2%;top:0;width:96%;height:68%;z-index:1;
  border:7px solid #141a2e;border-radius:5px;
  background:
    linear-gradient(#141a2e,#141a2e) 50% 0/9px 100% no-repeat,
    linear-gradient(#141a2e,#141a2e) 0 44%/100% 9px no-repeat,
    linear-gradient(to bottom,#ffe0a0 0%,#f7bb62 56%,#e39a46 100%);
  box-shadow:0 0 70px 26px rgba(255,198,112,.30);
}
/* つみかさなり。SVG 1まいに 4ひきを かき、g ごとに おくらせて 出す(viewBox 240x400) */
.ks-stack{
  /* かおが ひだり向きで からだが みぎ寄りなので、まどの まんなかより すこし ひだりに おく */
  position:absolute;left:48%;bottom:0;z-index:2;
  width:68%;transform:translateX(-50%);transform-origin:50% 100%;
  animation:ksSway .45s 1.45s ease-in-out 2;
}
.ks-stack svg{width:100%;height:auto;display:block}
/* ゆれは ちいさく。translateX(-50%)を けさない ように キーフレームにも 書く */
@keyframes ksSway{
  0%,100%{transform:translateX(-50%) rotate(0)}
  30%{transform:translateX(-50%) rotate(-2deg)}
  70%{transform:translateX(-50%) rotate(2deg)}
}
/* --d=その どうぶつが 出る おくらせ(0.3びょう きざみ)。あしもとから ぽんと 出す */
.ks-p{
  opacity:0;fill:#0d1220;transform-box:fill-box;transform-origin:50% 100%;
  animation:ksRise .34s var(--d) ease-out forwards;
}
@keyframes ksRise{
  0%{opacity:0;transform:translateY(18px) scale(.86)}
  100%{opacity:1;transform:none}
}
/* なきごえ。ふきだしは しろ地に こい ちゃ(こんの そらでも まどの あかりでも よめる) */
.ks-koe{
  position:absolute;z-index:4;white-space:nowrap;opacity:0;
  font-size:min(21px,4vw);font-weight:900;color:#2a2118;background:#fffdf5;
  padding:5px 12px;border-radius:12px;border:3px solid #2a2118;
  animation:ksKoe .4s var(--d) cubic-bezier(.2,1.6,.4,1) forwards;
}
.ks-koe.kL{right:66%}
.ks-koe.kR{left:66%}
@keyframes ksKoe{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
#cutin.kasane .ci-text{
  position:relative;z-index:5;max-width:92%;
  /* 4ひきが そろってから 出す。はばに あわせて 字を ちぢめる(ふうふう型・おかし型と おなじ) */
  font-size:min(46px,7.5vw);font-weight:900;color:#fff;letter-spacing:.06em;text-align:center;line-height:1.4;
  white-space:pre-line;
  text-shadow:3px 3px 0 #7a4a1f,-2px -2px 0 #7a4a1f,2px -2px 0 #7a4a1f,-2px 2px 0 #7a4a1f,0 6px 16px rgba(0,0,0,.35);
  animation:pop .45s 1.45s cubic-bezier(.2,1.6,.4,1) backwards;
}

/* なまえ専用型(としの なまえが つみあがる)
   わしの いろの 地に、としの なまえ(ね・うし・とら…)が うえから じゅんに 1だんずつ 出て、
   そのたびに ちいさな しゅいろの しるしが おされる。
   だんの かずは 1〜12で かわる。だんの たかさを だんの かずで わるので、12だんでも たてに おさまる。
   🔴じゅんいの すうじは 出さない(なんばんめ かは かかない) */
#cutin.namae .ci-inner{
  background:
    repeating-linear-gradient(90deg,rgba(160,140,105,.055) 0 2px,transparent 2px 7px),
    linear-gradient(#f6ecd7,#efe1c4);
  overflow:hidden;gap:16px;
}
/* --rows=だんの かず。だんの たかさは 60px を うわげんに、がめんの たかさを だんの かずで わる */
.nm-list{
  position:relative;z-index:1;--rh:min(60px,calc(60vh / var(--rows)));
  display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--rh) * .34) 0;
  border-top:3px double rgba(90,70,45,.4);border-bottom:3px double rgba(90,70,45,.4);
}
/* 1だん。なまえは ひだりぞろえ、しるしは みぎはしに おく。
   🔴まんなかぞろえに すると「い」と「ひつじ」で 1もじめの いちが ずれて、
     たてに ならんで いるように 見えない。なまえの あたまを そろえる */
.nm-row{
  position:relative;width:min(62vw,252px);height:var(--rh);padding-left:13%;
  display:flex;align-items:center;justify-content:flex-start;
  opacity:0;animation:nmRise .3s var(--d) ease-out forwards;
}
.nm-ji{
  font-family:'Yu Mincho','YuMincho','Hiragino Mincho ProN','Noto Serif JP',serif;
  font-size:calc(var(--rh) * .66);font-weight:700;color:#2e241a;letter-spacing:.14em;line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
/* しゅいんの ちいさい ばん(おしまいの印影と おなじ おされかた) */
.nm-in{
  position:absolute;right:4%;top:50%;width:calc(var(--rh) * .5);height:calc(var(--rh) * .5);
  opacity:0;mix-blend-mode:multiply;
  animation:nmSeal .3s calc(var(--d) + .08s) cubic-bezier(.3,1.3,.5,1) forwards;
}
.nm-in svg{width:100%;height:100%;display:block}
@keyframes nmRise{0%{opacity:0;transform:translateY(9px)}100%{opacity:1;transform:none}}
/* まんなかへ よせる translateY(-50%)を けさない ように キーフレームにも 書く */
@keyframes nmSeal{
  0%{opacity:0;transform:translateY(calc(-50% - 12px)) scale(1.7) rotate(6deg)}
  60%{opacity:.9;transform:translateY(-50%) scale(.92) rotate(-8deg)}
  100%{opacity:.9;transform:translateY(-50%) scale(1) rotate(-8deg)}
}
/* メインの もじは さいごの だんが 出てから したに フェードで 出す(--td=その おくらせ) */
#cutin.namae .ci-text{
  position:relative;z-index:2;max-width:88%;
  font-size:min(40px,6.6vw);font-weight:900;color:#5a3a1f;letter-spacing:.05em;text-align:center;line-height:1.4;
  white-space:pre-line;
  text-shadow:0 2px 0 rgba(255,255,255,.55);
  animation:fadein .4s var(--td) backwards;
}

/* はた専用型(しょうじごしの はたおり)
   がめん いっぱいの しょうじ。わしの いろに ゆきあかりの あわい あおじろを かさねる。
   まんなかに むすめの かげが すわって はたに むかう(よこ向き・てを まえに 出した すがた)。
   トンカラリの リズム(--per=0.65びょう)で かげが まえうしろに わずかに ゆれ、
   しょうじの したべには かげの おびが のこる。メインの もじは したに 出す。
   c.slow=true の ときは --per を 1.6ばいに して ゆっくり ゆらす(3まいめ)。
   🔴はねを ぬく すがたは かげでも つくらない。はたを うごかす すがただけ */
#cutin.hata .ci-inner{
  background:
    /* たての さん */
    repeating-linear-gradient(90deg,rgba(118,94,66,.5) 0 5px,transparent 5px 62px),
    /* よこの さん */
    repeating-linear-gradient(0deg,rgba(118,94,66,.5) 0 5px,transparent 5px 68px),
    /* わしの すきめ */
    repeating-linear-gradient(90deg,rgba(150,140,120,.05) 0 2px,transparent 2px 7px),
    /* ゆきあかり(うえほど あおじろい) */
    linear-gradient(to bottom,#e6eef7 0%,#eef1f0 48%,#e0e4e2 100%);
  overflow:hidden;justify-content:flex-end;gap:0;
}
/* むすめの かげ。しょうじに うつる ので ふちを すこし ぼかし、まっくろには しない */
.ht-kage{
  position:absolute;left:50%;top:50%;z-index:1;width:min(80vw,60vh,440px);
  transform:translate(-50%,-56%);
  filter:blur(1.6px);opacity:.84;
  animation:htSway var(--per,.65s) ease-in-out infinite;
}
.ht-kage svg{width:100%;height:auto;display:block}
/* トン(まえへ) → カラ(もどす) → リ(ちいさく) の 3はく。
   まんなかへ よせる translate(-50%,-56%)を けさない ように キーフレームにも 書く */
@keyframes htSway{
  0%{transform:translate(-50%,-56%)}
  28%{transform:translate(-46.5%,-56%)}
  58%{transform:translate(-51.5%,-56%)}
  78%{transform:translate(-49%,-56%)}
  100%{transform:translate(-50%,-56%)}
}
/* しょうじの したべの かげの おび */
.ht-obi{
  position:absolute;left:0;right:0;bottom:0;height:16%;z-index:2;
  background:linear-gradient(to top,rgba(58,48,38,.30),rgba(58,48,38,0));
}
#cutin.hata .ci-text{
  position:relative;z-index:3;max-width:90%;margin-bottom:8%;
  /* あかるい しょうじに 映える こい すみいろ + しろの ふち。
     はばに あわせて 字を ちぢめる(ふうふう型・おかし型と おなじ) */
  font-size:min(40px,6.6vw);font-weight:900;color:#2e2418;letter-spacing:.06em;text-align:center;line-height:1.5;
  white-space:pre-line;
  text-shadow:3px 3px 0 #fdfbf4,-2px -2px 0 #fdfbf4,2px -2px 0 #fdfbf4,-2px 2px 0 #fdfbf4,0 6px 14px rgba(70,60,45,.3);
  /* しずかな 場面なので はねる pop では なく、そっと うかびあがらせる */
  animation:fadein .5s .4s backwards;
}

/* いわの とびら専用型(ひらけ、ゴマ)
   がめん いっぱいの いわはだが まんなかから ひだり・みぎに われて ひらき、
   すきまから きんいろの ひかりが ほうしゃじょうに ひろがる。
   🔴hikari型の ひかりは しろ〜むらさきの ひえた いろ。ここは きん〜だいだいの あたたかい いろに して、
     おなじ「ひかりの 場面」でも 見わけが つくように する。
   とびらが ひらき切ってから、メインの もじを がめんの したに 出す */
#cutin.goma .ci-inner{background:#1c1408;overflow:hidden;justify-content:flex-end}
/* すきまから あふれる きんの ひかり。ほそい たての すじ から まるく ひろがる */
.gm-glow{
  position:absolute;left:50%;top:50%;z-index:1;
  /* がめんの すみまで ひかりが とどく おおきさ(たてよこの ながい ほうに あわせる) */
  width:max(120vw,120vh);height:max(120vw,120vh);border-radius:50%;
  background:radial-gradient(circle,
    #fffbe8 0%, #ffe9a8 18%, rgba(242,176,79,.72) 42%, rgba(201,122,38,.25) 66%, rgba(160,90,30,0) 82%);
  /* まんなかへ よせる translate(-50%,-50%)を けさない ように キーフレームにも 書く */
  transform:translate(-50%,-50%) scale(.05,.55);opacity:0;
  animation:gmGlow 1.5s .2s ease-out forwards;
}
@keyframes gmGlow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.05,.55)}
  25%{opacity:.85}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
/* ほうしゃせん。とびらの うしろで ゆっくり まわり、ひらいてから 見えてくる */
#cutin.goma .flines{z-index:1;opacity:0;animation:spin 16s linear infinite, fadein 1s .6s forwards}
/* いわはだ。ななめの すじ(そう)と こまかい つぶを かさねて ざらつかせる。
   ひだり・みぎを すこし かさねて、とじている あいだ すきまが 見えない ように する */
.gm-door{
  position:absolute;top:-2%;bottom:-2%;width:50.5%;z-index:2;
  background:
    /* こまかい ざらつき。ちいさく タイルさせ、うすい いろで つぶつぶだけを 出す
       (こい つぶを おおきく タイルさせると、いわでは なく ぬのの もように 見える) */
    radial-gradient(circle at 30% 30%, rgba(0,0,0,.11) 0 1.4px, transparent 2px),
    radial-gradient(circle at 68% 64%, rgba(255,255,255,.08) 0 1.4px, transparent 2px),
    /* おおきな まだら。タイルさせずに 1まいだけ しくので、くりかえしの もように ならない */
    radial-gradient(ellipse 60% 34% at 22% 18%, rgba(255,255,255,.10), transparent 70%),
    radial-gradient(ellipse 52% 40% at 78% 40%, rgba(0,0,0,.22), transparent 72%),
    radial-gradient(ellipse 70% 30% at 40% 72%, rgba(0,0,0,.17), transparent 70%),
    radial-gradient(ellipse 44% 26% at 86% 88%, rgba(255,255,255,.07), transparent 72%),
    /* いわの そう(ななめの すじ)。はばを ふぞろいに して、しま模様に 見えない ようにする */
    repeating-linear-gradient(97deg,
      rgba(0,0,0,.07) 0 6px, transparent 6px 15px,
      rgba(0,0,0,.04) 15px 23px, transparent 23px 41px),
    linear-gradient(165deg,#8a6c47 0%,#6f573a 34%,#5c5147 68%,#443c36 100%);
  background-size:23px 23px, 31px 31px, auto, auto, auto, auto, auto, auto;
}
.gm-L{left:0;border-right:6px solid #241a10;animation:gmOpenL 1.1s .25s cubic-bezier(.35,0,.25,1) forwards}
.gm-R{right:0;border-left:6px solid #241a10;animation:gmOpenR 1.1s .25s cubic-bezier(.35,0,.25,1) forwards}
@keyframes gmOpenL{0%{transform:translateX(0)}100%{transform:translateX(-101%)}}
@keyframes gmOpenR{0%{transform:translateX(0)}100%{transform:translateX(101%)}}
/* --d=またたきの おくらせ。とびらが ひらいてから きらめく */

#cutin.goma .ci-text{

     はばに あわせて 字を ちぢめる(ふうふう型・おかし型と おなじ) */
  font-size:min(46px,7.5vw);font-weight:900;color:#fffdf0;letter-spacing:.08em;text-align:center;line-height:1.4;
  white-space:pre-line;
  text-shadow:3px 3px 0 #6b4519,-2px -2px 0 #6b4519,2px -2px 0 #6b4519,-2px 2px 0 #6b4519,0 6px 18px rgba(0,0,0,.5);
  /* とびらが ひらき切ってから(0.25 + 1.1びょう)出す */
  animation:pop .5s 1.45s cubic-bezier(.2,1.6,.4,1) backwards;
}

/* ひざし専用型(ぽかぽか)
   あたたかい いろの ほうしゃせんが ゆっくり まわり、まんなかが やわらかく あかるい。
   🔴fuu型(あおい かぜ)と ならべて 出す ので、いろは クリーム〜だいだいだけに して 見わけを つける。
   strong=2だんめ(さんさん)。ほうしゃが はやく こく、すこし あかみを おびる。
   ゆれ(shake)は 入れない(ひざしは ふきつけない) */

#cutin.poka .ci-inner{
  background:radial-gradient(circle at 50% 44%, #fffbe8 0%, #ffeec0 30%, #ffd68a 58%, #f2b04f 100%);
  overflow:hidden;justify-content:flex-end;
}
#cutin.poka .ci-inner.strong{
  background:radial-gradient(circle at 50% 44%, #fffdf2 0%, #ffe6a8 26%, #ffbf6a 56%, #e08a3a 100%);
}
/* ほうしゃせん。まんなかへ よせる translate(-50%,-50%)を けさない ように キーフレームにも 書く */
.pk-rays{
  position:absolute;left:50%;top:44%;z-index:1;

  width:max(150vw,150vh);height:max(150vw,150vh);
  transform:translate(-50%,-50%);opacity:.5;
  animation:pkSpin 26s linear infinite;
}
.pk-rays svg{width:100%;height:100%;display:block}
#cutin.poka .strong .pk-rays{opacity:.7;animation-duration:9s}
@keyframes pkSpin{
  0%{transform:translate(-50%,-50%) rotate(0)}
  100%{transform:translate(-50%,-50%) rotate(360deg)}
}
/* まんなかの やわらかい あかるみ。ゆっくり ふくらんで しぼむ */

  position:absolute;left:50%;top:44%;z-index:2;

  transform:translate(-50%,-50%);
  background:radial-gradient(circle,
    #fffdf4 0%, rgba(255,248,220,.9) 32%, rgba(255,228,156,.5) 60%, rgba(255,214,110,0) 80%);
  animation:pkBreath 2.2s ease-in-out infinite;
}
#cutin.poka .strong .pk-glow{animation-duration:1.1s}
@keyframes pkBreath{
  0%,100%{transform:translate(-50%,-50%) scale(.92);opacity:.82}
  50%{transform:translate(-50%,-50%) scale(1.07);opacity:1}
}
#cutin.poka .ci-text{
  position:relative;z-index:3;max-width:92%;margin-bottom:11%;
  /* あかるい ひざしの 上に のせる ので、しろい 字に こい だいだいの ふち。
     はばに あわせて 字を ちぢめる(ふうふう型・いわの とびら型と おなじ) */
  font-size:min(46px,7.5vw);font-weight:900;color:#fffdf0;letter-spacing:.08em;text-align:center;line-height:1.4;

  animation:pop .5s cubic-bezier(.2,1.6,.4,1);
}

/* おしまいの印影(結末の絵の上に押す・背景透過) */
.seal{
  position:absolute;right:5%;top:7%;width:44%;max-width:220px;
  pointer-events:none;opacity:0;mix-blend-mode:multiply;
  animation:sealPress .5s .5s cubic-bezier(.3,1.3,.5,1) forwards;
}
.seal svg{width:100%;height:auto;display:block}
@keyframes sealPress{
  0%{opacity:0;transform:translateY(-70px) scale(1.8) rotate(3deg)}
  55%{opacity:.9;transform:translateY(0) scale(.93) rotate(-9deg)}
  75%{transform:scale(1.05) rotate(-9deg)}
  100%{opacity:.9;transform:scale(1) rotate(-9deg)}
}

@keyframes pop{0%{transform:scale(.2) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}

@keyframes fromleft{0%{transform:translateX(-60vw)}100%{transform:translateX(0)}}
@keyframes fromright{0%{transform:translateX(60vw)}100%{transform:translateX(0)}}

}

  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}

  let teeth = '';
  for(let i = 0; i < 11; i++){

    const w = 15, h = 22 + 20 * Math.sin(Math.PI * t);
    teeth += `<polygon points="${(x-w).toFixed(1)},${(y-10).toFixed(1)} ${(x+w).toFixed(1)},${(y-10).toFixed(1)} ${x.toFixed(1)},${(y+h).toFixed(1)}"`
      + ` fill="#fffdf5" stroke="#4a3a2c" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  const g = `<path d="M0 0 H400 V110 Q200 250 0 110 Z" fill="#8a8f9a" stroke="#4a3a2c" stroke-width="4"/>`
    + `<path d="M0 104 Q200 244 400 104" fill="none" stroke="#a8616e" stroke-width="14" stroke-linecap="round" opacity=".9"/>`
    + teeth;
  return `<svg viewBox="0 0 400 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`
    + (bottom ? `<g transform="translate(0 260) scale(1 -1)">${g}</g>` : g) + `</svg>`;
}

/* なきごえ。したから じゅんに、ひだり・みぎ こうごに とびださせる

function kasaneKoe(){

/* なまえ型で 1だんずつ おされる ちいさな しゅいん(おしまいの印影の こがた)。
   ちいさく 出るので、そとわくの きれめと まんなかの まるだけで「はんこ」に みえる ように する */
function namaeSeal(){

/* しょうじに うつる かげ(はた型)。むすめは よこ向きに すわり、てを まえに 出して はたを うごかす。
   まえに はたおりきの わくを おく(たてばしら・うわげた・まきとり・おさ・たていと)。
   ぜんぶ おなじ いろの ひとかたまりの かげなので、かさなった ところは とけあって 見える。
   🔴はねを ぬく どうさ・きずは かかない。はたを うごかす すがただけ */
function hataKage(){
  const k = '#2a2118';
  return `<svg viewBox="0 0 260 200" xmlns="http://www.w3.org/2000/svg">`
    /* --- はたおりき --- */
    + `<g fill="${k}">`
    + `<rect x="206" y="30" width="10" height="150" rx="2"/>`
    + `<rect x="168" y="60" width="9" height="120" rx="2"/>`
    + `<rect x="158" y="30" width="60" height="10" rx="3"/>`
    + `<circle cx="211" cy="56" r="13"/>`
    + `<circle cx="164" cy="124" r="12"/>`
    + `<path d="M203 50 L161 114 L167 126 L211 62 Z"/>`
    + `<rect x="178" y="40" width="8" height="84" rx="3" transform="rotate(7 182 40)"/>`
    + `</g>`
    /* --- むすめ(よこ向き・すわった すがた) ---
       あたま(まる)→くび(ほそく)→かた(ひろく)の じゅんに ほそめて、かげでも あたまが わかるように する */
    + `<g fill="${k}">`
    /* きものの すそ(すわった あしを おおう) */
    + `<path d="M48 178 Q42 148 58 124 L98 120 Q136 132 144 162 L146 178 Z"/>`
    /* からだ(すこし まえに かたむける) */
    + `<path d="M70 62 Q54 98 60 126 L100 122 Q106 96 98 74 Z"/>`
    /* くび(あたまと かたの あいだを ほそく のこす。かみと からだの あいだに すきまが
       できない ように、ひだり下まで のばす) */
    + `<rect x="70" y="56" width="22" height="22"/>`
    /* かみ(あたまの うしろの ふくらみ + せなかに たらした ながい かみ。
       すその 上に かかる ところまで のばす) */
    + `<ellipse cx="74" cy="48" rx="18" ry="21"/>`
    + `<path d="M58 58 Q46 94 55 130 L74 128 Q66 92 72 62 Z"/>`
    /* あたま */
    + `<circle cx="86" cy="46" r="19"/>`
    /* うで(まえに 出して はたに とどく) */
    + `<path d="M92 80 Q122 84 156 102 L152 117 Q120 101 90 98 Z"/>`
    + `</g>`
    + `</svg>`;
}

/* いわの とびら型で、とびらが ひらいてから またたく きんの つぶ。
   よこいち(%) / たかさ(%) / またたきの おくらせ(びょう)。
   とびらが ひらき切る 1.35びょうより あとから ひからせる */
function gomaSparks(){
  const rows = [[38,30,1.42], [58,24,1.68], [46,52,1.55], [64,58,1.82], [34,64,1.95], [52,40,1.38]];
  return rows.map(r => `<span class="gm-spark" style="left:${r[0]}%;top:${r[1]}%;--d:${r[2]}s">✦</span>`).join('');
}

/* ひざし型の ほうしゃせん。あたたかい いろの くさびを まるく ならべる。
   strong=2だんめ(さんさん)。ほんすうを ふやし、はばを ひろげ、すこし あかみの ある いろに する。
   まわす のは CSS(.pk-rays)の しごと。ここは かたちだけを つくる */
function pokaRays(strong){
  const n = strong ? 30 : 20;
  const col = strong ? ['#ffd07a','#ffbe62'] : ['#fff2cc','#ffe3a8'];
  const w = strong ? 0.052 : 0.038;
  let s = `<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">`;
  for(let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2;
    const r1 = 150, r2 = 24;
    const x1 = 100 + Math.cos(a - w) * r1, y1 = 100 + Math.sin(a - w) * r1;
    const x2 = 100 + Math.cos(a + w) * r1, y2 = 100 + Math.sin(a + w) * r1;
    const x3 = 100 + Math.cos(a) * r2,     y3 = 100 + Math.sin(a) * r2;
    s += `<polygon points="${x1.toFixed(1)},${y1.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} ${x3.toFixed(1)},${y3.toFixed(1)}" fill="${col[i % 2]}"/>`;
  }
  return s + '</svg>';
}

    inner = `<div class="ci-inner">`

    inner = `<div class="ci-inner${c.strong ? ' strong' : ''}">`

      + `<div class="pk-glow"></div>`
      + `<div class="ci-text">${c.text}</div></div>`;
    dur = 2200;
  }
  box.innerHTML = inner;
  cutinNext = then;
  cutinShownAt = Date.now();
  cutinTimer = setTimeout(endCutin, dur);
}
function endCutin(){
  clearTimeout(cutinTimer);
  const box = $('cutin');
  if(!box.classList.contains('on')) return;
  box.className = '';
  box.innerHTML = '';
  const n = cutinNext; cutinNext = null;
  if(typeof n === 'function'){ n(); }
  else if(n){ go(n); }
}
$('cutin').addEventListener('click', ()=>{
  if(Date.now() - cutinShownAt < CUTIN_SKIP_MS) return;
  endCutin();
});

const READ_MS = 2200;
let sceneReadyAt = 0, sceneReadyTimer = null, tapAdvance = null;
function lockButtons(){
  sceneReadyAt = Date.now() + READ_MS;
  clearTimeout(sceneReadyTimer);
  const btns = Array.from($('chs').querySelectorAll('button'));
  btns.forEach(b=>{ b.disabled = true; });
  sceneReadyTimer = setTimeout(()=>{
    btns.forEach(b=>{
      b.disabled = false;
      if(b.classList.contains('next')) b.classList.add('ready');
    });
  }, READ_MS);
}
$('scGame').addEventListener('click', e=>{
  if(e.target.closest('button')) return;
  if(!tapAdvance) return;
  if(Date.now() < sceneReadyAt) return;
  Sound.se('page');
  tapAdvance();
});

/* 物語の外の画面(タイトル・おはなしえらび・ずかん・せってい)は 国を特定しない タイトルの曲。

   ※ゲーム画面から 歯車で ひらいた せっていは 物語の つづきなので 曲は かえない */
function isOutOfStory(id){
  if(id === 'scSettings') return settingsBack !== 'scGame';
  return id === 'scTitle' || id === 'scSelect' || id === 'scZukan';
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo(0,0);
  if(isOutOfStory(id)) Sound.setTrack('title');
  if(id === 'scTitle') refreshContBtn();
}

/* ================= つづきから よむ =================
   よみかけの ばしょを 1つだけ おぼえておく。すてる のは
   けつまつに ついた とき / おはなし えらびへ もどった とき / きろくを けした とき */
function saveCur(rec){ saveJson(CUR_KEY, rec); }
function clearCur(){
  try{ localStorage.removeItem(CUR_KEY); }catch(e){}
  refreshContBtn();
}
/* 記録が ふるい(おはなしや シーンが もう ない)ときは つかわず すてる */
function loadCur(){
  const c = loadJson(CUR_KEY, null);
  if(!c) return null;
  if(c.mode){
    const src = c.mode === 'recap' ? RECAP[c.key] : (FIRST_RUNS || {})[c.key];
    const list = src && src.scenes;
    if(!list || !(c.idx >= 0 && c.idx < list.length)) return null;
    return c;
  }
  if(!c.story || !STORIES[c.story] || !CUR_SC()[c.scene]) return null;
  return c;
}
function refreshContBtn(){
  const b = $('btnCont');
  if(!b) return;
  b.textContent = t('cont');
  b.style.display = loadCur() ? '' : 'none';
}
function resumeCur(){
  const c = loadCur();
  if(!c){ refreshContBtn(); return; }
  F = Object.assign({dango:null, dog:0, saru:0, kiji:0, gate:null, style:null}, c.f || {});
  if(c.story) currentStory = c.story;
  if(c.mode){
    seqKey = c.key;
    seqMode = c.mode;
    seqList = (c.mode === 'recap' ? RECAP[c.key] : FIRST_RUNS[c.key]).scenes;
    seqIdx = c.idx;
    showScreen('scGame');
    playStep();
    return;
  }
  seqList = null;
  showScreen('scGame');
  go(c.scene);
}

function startStory(story){
  currentStory = story;
  /* その おはなしの 本編(momo / akz)を まだ クリアしていないなら 正統ルートの 一本道 */
  const tale = taleOf(story);
  const fr = FIRST_RUNS[tale];
  if(story === tale && fr && !taleCleared(tale)){
    F = Object.assign({dango:null, dog:0, saru:0, kiji:0, gate:null, style:null}, fr.init);
    seqList = fr.scenes;
    seqIdx = 0;
    seqMode = 'first';
    seqKey = tale;
    showScreen('scGame');
    playStep();
    return;
  }
  seqList = null;
  F = Object.assign({dango:null, dog:0, saru:0, kiji:0, gate:null, style:null}, STORIES[story].init);
  showScreen('scGame');
  go(STORIES[story].start);
}

function go(id){
  const s = CUR_SC()[id];
  if(!s){ console.error('scene not found: '+id); return; }
  if(s.cutin){
    const then = (typeof s.then === 'function') ? s.then(F) : s.then;
    showCutin(s.cutin, then);
    return;
  }
  render(s, id);
}

function render(s, id){
  window.scrollTo(0,0);
  if(s.enter) Object.assign(F, s.enter);
  $('stage').innerHTML = s.art && ART[s.art] ? ART[s.art](F) : '';
  if(s.art) Sound.setTrack(TRACK_BY_ART[s.art]);
  const text = (typeof s.text === 'function') ? s.text(F) : (s.text || '');
  const chs = $('chs');
  chs.innerHTML = '';

  if(s.ending !== undefined){
    tapAdvance = null;
    finishEnding(s, text);
    return;
  }
  saveCur({story:currentStory, scene:id, f:F});
  $('tbox').textContent = text;

  if(s.choices){
    const list = (typeof s.choices === 'function') ? s.choices(F) : s.choices;
    list.forEach(c=>{
      const b = document.createElement('button');
      b.textContent = c.t;
      b.addEventListener('click', ()=>{ Sound.se('pi'); if(c.set) Object.assign(F, c.set); go(c.go); });
      chs.appendChild(b);
    });
    tapAdvance = null;
  }else if(s.next){
    const b = document.createElement('button');
    b.className = 'next';
    b.textContent = t('next');
    b.addEventListener('click', ()=>{ Sound.se('page'); go(s.next); });
    chs.appendChild(b);
    tapAdvance = ()=>go(s.next);
  }
  lockButtons();
}

function pressSeal(){
  const d = document.createElement('div');
  d.className = 'seal';
  const chars = t('seal');
  let texts = '';
  if(PREF.lang === 'en'){
    texts = `<text x="100" y="88" text-anchor="middle" font-size="42" font-weight="900" fill="#c0392b" opacity=".95" font-family="inherit">${chars[0]}</text>`
      + `<text x="100" y="138" text-anchor="middle" font-size="42" font-weight="900" fill="#c0392b" opacity=".9" font-family="inherit">${chars[1]}</text>`;
  }else{
    texts = chars.map((ch,i)=>`<text x="100" y="${60+i*39}" text-anchor="middle" font-size="37" font-weight="900" fill="#c0392b" opacity="${i%2?.9:.95}" font-family="inherit">${ch}</text>`).join('');
  }
  d.innerHTML = `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="92" fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-dasharray="128 5 84 4 156 7 46 5 90 6"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="96 5 130 6 64 4 110 7"/>
    ${texts}
  </svg>`;
  $('stage').appendChild(d);
  setTimeout(()=>Sound.se('stamp'), 520);
}

function finishEnding(s, text){
  const eid = (typeof s.ending === 'function') ? s.ending(F) : s.ending;
  const tale = taleOf(currentStory);
  const wasCleared = taleCleared(tale);
  const hadKiji = !!unlocks.kiji;
  const hadGma = !!unlocks.gma;
  const hadMouse = !!unlocks.mouse;
  const hadHime = !!unlocks.hime;
  const hadPrenga = !!unlocks.prenga;
  const hadTori = !!unlocks.tori;
  const hadTsuki = !!unlocks.tsuki;
  const hadOndori = !!unlocks.ondori;
  const hadJnezumi = !!unlocks.jnezumi;
  const hadTbaa = !!unlocks.tbaa;
  const hadKashira = !!unlocks.kashira;
  const hadTaiyou = !!unlocks.taiyou;
  const isNew = !zukan.includes(eid);
  clearCur();                                   /* けつまつに ついたら よみかけは おわり */
  if(isNew){ zukan.push(eid); saveJson(SAVE_KEY, zukan); Sound.se('kira'); }
  if(currentStory === 'momo' && F.kiji === 1 && !unlocks.kiji){
    unlocks.kiji = true; saveJson(UNLOCK_KEY, unlocks);
  }
  if(eid === 'za_chie' && !unlocks.gma){
    unlocks.gma = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* かぶの はなし(かぶ視点)の けつまつを 1つでも みつけたら ねずみの はなしが ひらく */
  if(/^kt_/.test(eid) && !unlocks.mouse){
    unlocks.mouse = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* うらしまたろうの「つるに なった たろう」か「あけなかった たまてばこ」で おとひめの はなしが ひらく */
  if((eid === 'u_tsuru' || eid === 'u_akenai') && !unlocks.hime){
    unlocks.hime = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* さんびきの こぶたの「イギリスの ほんとうの おはなし」か「さいしょから 3びきで」で レンガの いえの はなしが ひらく */
  if((eid === 'pb_genten' || eid === 'pb_kyoryoku') && !unlocks.prenga){
    unlocks.prenga = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* ヘンゼルと グレーテルの「かわの むこうへ」か「むらの ふゆ」で しろい とりの はなしが ひらく */
  if((eid === 'hg_kawa' || eid === 'hg_mura') && !unlocks.tori){
    unlocks.tori = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* かぐやひめの「はごろもの まえに」か「ふしの くすり」で つきの つかいの はなしが ひらく */
  if((eid === 'kg_koromo' || eid === 'kg_kusuri') && !unlocks.tsuki){
    unlocks.tsuki = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* ブレーメンの おんがくたいの「ブレーメンの まちで」か「もりの あさ」で オンドリの はなしが ひらく */
  if((eid === 'br_bremen' || eid === 'br_mori') && !unlocks.ondori){
    unlocks.ondori = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* じゅうにしの はじまりの「ウシの せなかで」か「まいとしの あいさつ」で ネズミの はなしが ひらく */
  if((eid === 'ju_ushi' || eid === 'ju_kao') && !unlocks.jnezumi){
    unlocks.jnezumi = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* つるの おんがえしの「もう おらなくて いい」か「のぞかない ふゆ」で おばあさんの はなしが ひらく */
  if((eid === 'ts_mou' || eid === 'ts_nozokanai') && !unlocks.tbaa){
    unlocks.tbaa = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* アリババと 40にんの とうぞくの「なわと やくにん」か「かしらは にげた」で とうぞくの かしらの はなしが ひらく */
  if((eid === 'ab_rouya' || eid === 'ab_nigeta') && !unlocks.kashira){
    unlocks.kashira = true; saveJson(UNLOCK_KEY, unlocks);
  }
  /* きたかぜと たいようの「ふたりの せんたくびより」か「こかげで ひとやすみ」で たいようの はなしが ひらく */
  if((eid === 'kz_futari' || eid === 'kz_kokage') && !unlocks.taiyou){
    unlocks.taiyou = true; saveJson(UNLOCK_KEY, unlocks);
  }

  let msg = text + '\n\n';
  msg += isNew ? t('newEnd')(zkName(eid)) : t('dupEnd')(zkName(eid));
  if(!wasCleared && taleCleared(tale)){
    msg += '\n' + t('unlockChoice') + '\n' + t('unlockNote')
      + '\n' + t(TALE_UNLOCK_MSG[tale] || 'unlockOni');
  }
  if(!hadKiji && unlocks.kiji){
    msg += '\n' + t('unlockKiji');
  }
  if(!hadGma && unlocks.gma){
    msg += '\n' + t('unlockGma');
  }
  if(!hadMouse && unlocks.mouse){
    msg += '\n' + t('unlockMouse');
  }
  if(!hadHime && unlocks.hime){
    msg += '\n' + t('unlockHime');
  }
  if(!hadPrenga && unlocks.prenga){
    msg += '\n' + t('unlockPrenga');
  }
  if(!hadTori && unlocks.tori){
    msg += '\n' + t('unlockTori');
  }
  if(!hadTsuki && unlocks.tsuki){
    msg += '\n' + t('unlockTsuki');
  }
  if(!hadOndori && unlocks.ondori){
    msg += '\n' + t('unlockOndori');
  }
  if(!hadJnezumi && unlocks.jnezumi){
    msg += '\n' + t('unlockJnezumi');
  }
  if(!hadTbaa && unlocks.tbaa){
    msg += '\n' + t('unlockTbaa');
  }
  if(!hadKashira && unlocks.kashira){
    msg += '\n' + t('unlockKashira');
  }
  if(!hadTaiyou && unlocks.taiyou){
    msg += '\n' + t('unlockTaiyou');
  }
  $('tbox').textContent = msg;

  const chs = $('chs');
  const bZ = document.createElement('button');
  bZ.className = 'zk';
  bZ.textContent = t('btnZukan');
  bZ.addEventListener('click', ()=>{ renderZukan(); showScreen('scZukan'); });
  chs.appendChild(bZ);

  const bR = document.createElement('button');
  bR.className = 'next';
  bR.textContent = t('btnAgain');
  bR.addEventListener('click', ()=>startStory(currentStory));
  chs.appendChild(bR);

  const bS = document.createElement('button');
  bS.className = 'next';
  bS.textContent = t('btnSelect');
  bS.addEventListener('click', ()=>{ renderSelect(); showScreen('scSelect'); });
  chs.appendChild(bS);

  tapAdvance = null;
  lockButtons();
  pressSeal();
}

/* ================= 一本道再生(はじめての1かいめ / ずかんの振り返り) =================
   seqKey は その列の もとに なった キー(first=tale / recap=けつまつID)。つづきの ふっかつに つかう */
let seqList = null, seqIdx = 0, seqMode = null, seqKey = null;

function startRecap(eid){
  const r = RECAP[eid];
  if(!r) return;
  F = Object.assign({dango:null, dog:0, saru:0, kiji:0, gate:null, style:null}, r.f || {});
  seqList = r.scenes;
  seqIdx = 0;
  seqMode = 'recap';
  seqKey = eid;
  showScreen('scGame');
  playStep();
}
function exitRecap(){
  seqList = null;
  clearCur();
  renderZukan();
  showScreen('scZukan');
}
function playStep(){
  if(!seqList || seqIdx >= seqList.length){
    if(seqMode === 'recap') exitRecap();
    return;
  }
  const s = CUR_SC()[seqList[seqIdx++]];
  if(!s){ seqList = null; return; }
  if(s.enter) Object.assign(F, s.enter);
  if(s.cutin){ showCutin(s.cutin, playStep); return; }
  window.scrollTo(0,0);
  $('stage').innerHTML = s.art && ART[s.art] ? ART[s.art](F) : '';
  if(s.art) Sound.setTrack(TRACK_BY_ART[s.art]);
  const text = (typeof s.text === 'function') ? s.text(F) : (s.text || '');
  const chs = $('chs');
  chs.innerHTML = '';
  if(s.ending !== undefined){
    const mode = seqMode;
    seqList = null;
    if(mode === 'first'){
      tapAdvance = null;
      finishEnding(s, text);
      return;
    }
    $('tbox').textContent = text;
    const b = document.createElement('button');
    b.className = 'zk';
    b.textContent = t('btnZBack');
    b.addEventListener('click', exitRecap);
    chs.appendChild(b);
    tapAdvance = null;
    lockButtons();
    pressSeal();
    return;
  }
  /* seqIdx は もう つぎを さしている ので、いま だしている 1つ 前を おぼえる */
  saveCur({story:currentStory, mode:seqMode, key:seqKey, idx:seqIdx - 1, f:F});
  $('tbox').textContent = text;
  const b = document.createElement('button');
  b.className = 'next';
  b.textContent = t('next');
  b.addEventListener('click', ()=>{ Sound.se('page'); playStep(); });
  chs.appendChild(b);
  tapAdvance = playStep;
  lockButtons();
}

    const d = document.createElement('div');
    d.className = 'card' + (cls ? ' ' + cls : '');
    d.innerHTML = '<div class="ico">'+ico+'</div><div><div class="nm">'+nm+'</div><div class="tg">'+tg+'</div></div>';
    if(onClick) d.addEventListener('click', onClick);
    return d;
  };

  SELECT_CARDS.forEach(c=>{
    if(c.soon || !STORIES[c.story]){
      box.appendChild(mk(c.ico, t(c.nm), t('prep'), null, 'dim'));
      return;
    }
    if(c.open && !c.open()){
      box.appendChild(mk('🔒', t('unknown'), t(c.lock), null, 'locked'));
      return;
    }
    const tg = (c.tagFirst && !taleCleared(c.tale)) ? t(c.tagFirst) : t(c.tag);
    box.appendChild(mk(c.ico, t(c.nm), tg, ()=>startStory(c.story)));
  });
}

/* ================= ずかん ================= */
function renderZukan(){
  const grid = $('zgrid');
  grid.innerHTML = '';
  $('zTitle').textContent = t('zTitle');
  $('znote').textContent = t('zNote');
  $('btnZBack').textContent = t('back');
  let n = 0, total = 0;
  CUR_ZK().forEach(z=>{
    /* おはなしごとの みだし行(全幅・かずには 入れない) */
    if(z.section){
      const h = document.createElement('div');
      h.className = 'zsec';
      h.textContent = z.section;
      grid.appendChild(h);
      /* note が あれば みだしの すぐ下に 注記を 1だん だす */
      if(typeof z.note === 'string' && z.note){
        const nt = document.createElement('div');
        nt.className = 'zsecnote';
        nt.textContent = z.note;
        grid.appendChild(nt);
      }
      return;
    }
    total++;
    const got = zukan.includes(z.id);
    if(got) n++;
    const d = document.createElement('div');
    d.className = 'zcell' + (got ? '' : ' lock');
    d.innerHTML = got
      ? '<div class="zn">⭐ ' + z.n + '</div><div class="zh">' + t('zFound') + '</div>'
      : '<div class="zn">' + t('unknown') + '</div><div class="zh">' + t('zHint') + z.h + '</div>';
    if(got && typeof RECAP !== 'undefined' && RECAP[z.id]){
      d.style.cursor = 'pointer';
      d.addEventListener('click', ()=>startRecap(z.id));
    }
    grid.appendChild(d);
  });
  $('zcount').textContent = t('zCount')(n, total);
}

/* ================= せってい ================= */
let settingsBack = 'scTitle';

function applyFs(){
  document.body.setAttribute('data-fs', PREF.fs);
}
function savePref(){ saveJson(PREF_KEY, PREF); }

function seg(el, opts, curIdx, onPick){
  el.innerHTML = '';
  opts.forEach((label, i)=>{
    const b = document.createElement('button');
    b.textContent = label;
    if(i === curIdx) b.classList.add('on');
    b.addEventListener('click', ()=>{ onPick(i); renderSettings(); });
    el.appendChild(b);
  });
}
function renderSettings(){
  $('setTitle').textContent = t('setTitle');
  $('lblFs').textContent = t('lblFs');
  $('lblBgm').textContent = t('lblBgm');
  $('lblSe').textContent = t('lblSe');
  $('lblLang').textContent = t('lblLang');
  $('btnSetBack').textContent = t('back');
  const fsKeys = ['s','m','l'];
  seg($('segFs'), t('fsOpts'), fsKeys.indexOf(PREF.fs), i=>{ PREF.fs = fsKeys[i]; applyFs(); savePref(); });
  seg($('segBgm'), t('volOpts'), PREF.bgm, i=>{ PREF.bgm = i; Sound.setVolumes(VOLS[PREF.bgm], VOLS[PREF.se]); savePref(); });
  seg($('segSe'), t('volOpts'), PREF.se, i=>{ PREF.se = i; Sound.setVolumes(VOLS[PREF.bgm], VOLS[PREF.se]); savePref(); Sound.se('pi'); });
  seg($('segLang'), ['にほんご','English'], PREF.lang==='en' ? 1 : 0, i=>{
    PREF.lang = i===1 ? 'en' : 'ja';
    savePref();
    applyLang();
    seqList = null;
    settingsBack = 'scTitle';
  });
}

/* ================= タイトルの絵 =================
   art.js の ART.title(世界の物語の とびら)を えがく。まだ ない ときは これまでの 🍑 */
function renderTitleArt(){
  const box = $('titleArt');
  if(!box) return;
  if(typeof ART !== 'undefined' && typeof ART.title === 'function'){
    box.classList.remove('momo');
    box.innerHTML = ART.title();
  }else{
    box.classList.add('momo');
    box.textContent = '🍑';
  }
}

/* ================= タイトル文言 ================= */
function applyLang(){
  document.documentElement.lang = PREF.lang;
  $('ttl').innerHTML = t('title');
  $('ttlSub').textContent = t('subtitle');
  $('btnStart').textContent = t('start');
  refreshContBtn();
  $('btnZukan').textContent = t('zukan');
  $('btnSettings').textContent = t('settings');
  $('btnGameBack').textContent = t('selBack');
  $('footBox').innerHTML = t('footVer') + '<br>'
    + t('footOrig') + '<br>' + t('footFirst') + '<br>' + t('footCreate') + '<br>'
    + '<a href="https://soudansoyogi.com/" target="_blank" rel="noopener">' + t('credit') + '</a><br>'
    + '<a href="privacy.html">' + t('privacy') + '</a><br><br>'
    + '<button id="btnReset">' + t('reset') + '</button>';
  bindReset();
  renderSettings();
}

/* ================= ボタン ================= */
$('btnStart').addEventListener('click', ()=>{ renderSelect(); showScreen('scSelect'); });
$('btnCont').addEventListener('click', ()=>resumeCur());
$('btnZukan').addEventListener('click', ()=>{ renderZukan(); showScreen('scZukan'); });
$('btnSettings').addEventListener('click', ()=>{ settingsBack = 'scTitle'; renderSettings(); showScreen('scSettings'); });
$('btnGear').addEventListener('click', ()=>{ settingsBack = 'scGame'; renderSettings(); showScreen('scSettings'); });
$('btnSetBack').addEventListener('click', ()=>{ showScreen(settingsBack); });
$('btnSelBack').addEventListener('click', ()=>showScreen('scTitle'));
$('btnZBack').addEventListener('click', ()=>showScreen('scTitle'));
$('btnGameBack').addEventListener('click', ()=>{ seqList = null; clearCur(); renderSelect(); showScreen('scSelect'); });

let resetArmed = null;
function bindReset(){
  const b = $('btnReset');
  if(!b) return;
  b.addEventListener('click', ()=>{
    if(resetArmed){
      clearTimeout(resetArmed);
      resetArmed = null;
      try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(UNLOCK_KEY); localStorage.removeItem(CUR_KEY); }catch(e){}
      location.reload();
      return;
    }
    b.textContent = t('resetConfirm');
    b.style.color = '#c0392b';
    b.style.borderColor = '#c0392b';
    resetArmed = setTimeout(()=>{
      resetArmed = null;
      b.textContent = t('reset');
      b.style.color = '';
      b.style.borderColor = '';
    }, 5000);
  });
}

/* ================= 起動 ================= */
applyFs();
applyLang();
renderTitleArt();
/* 🔴起動時は状態を合わせるだけで鳴らさない(最初のタップから) */
Sound.setVolumes(VOLS[PREF.bgm], VOLS[PREF.se], false);
/* さいしょに 鳴る 1曲目が 和の里(home)に ならないよう、鳴らす前に タイトルの曲に しておく */
Sound.setTrack('title');

/* Web版(GitHub Pages)の オフライン対応。file:// では 登録しない */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
